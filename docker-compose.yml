version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kdd}
      POSTGRES_USER: ${POSTGRES_USER:-kdd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kdd}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kdd}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kdd-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kdd-network

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kdd}
      DB_USERNAME: ${POSTGRES_USER:-kdd}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kdd}
      REDIS_HOST: redis
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kdd-network

networks:
  kdd-network:
    driver: bridge

volumes:
  pg_data:
