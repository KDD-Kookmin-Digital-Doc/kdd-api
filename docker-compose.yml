version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kdd
      POSTGRES_USER: kdd
      POSTGRES_PASSWORD: kdd
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kdd-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - kdd-network

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kdd
      DB_USERNAME: kdd
      DB_PASSWORD: kdd
      REDIS_HOST: redis
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - kdd-network

networks:
  kdd-network:
    driver: bridge

volumes:
  pg_data:
