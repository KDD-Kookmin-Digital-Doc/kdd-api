server:
  port: 8000

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kdd}
    username: ${DB_USERNAME:kdd}
    password: ${DB_PASSWORD:kdd}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

app:
  gemini-api-key: ${GEMINI_API_KEY:}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  allowed-domain: ${ALLOWED_DOMAIN:kookmin.ac.kr}
  doc-admin-emails: ${DOC_ADMIN_EMAILS:}
  jwt-secret: ${JWT_SECRET}
  upload-dir: ${UPLOAD_DIR:uploads}
  chunk-size: ${CHUNK_SIZE:550}
  chunk-overlap: ${CHUNK_OVERLAP:100}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
