server:
  port: 8000

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Pre-Flyway baseline; existing schema captured by V1__baseline_schema.sql"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 1800000
    refresh-token-expiry: 1209600000
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
  auth:
    allowed-domain: ${ALLOWED_DOMAIN:kookmin.ac.kr}
    admin-emails: ${DOC_ADMIN_EMAILS:}

ai:
  server:
    base-url: ${AI_SERVER_URL}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:5000}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:120000}
