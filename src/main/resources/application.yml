server:
  port: 8000

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 1800000
    refresh-token-expiry: 1209600000
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
  auth:
    allowed-domain: ${ALLOWED_DOMAIN:kookmin.ac.kr}
    admin-emails: ${DOC_ADMIN_EMAILS:}
  ai:
    server-url: ${AI_SERVER_URL}

ai:
  server:
    base-url: ${AI_SERVER_URL}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:5000}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:120000}
