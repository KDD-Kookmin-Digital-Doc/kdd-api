server:
  port: 8000

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kdd}
    username: ${DB_USERNAME:kdd}
    password: ${DB_PASSWORD:kdd}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 1800000
    refresh-token-expiry: 1209600000
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback}
  auth:
    allowed-domain: ${ALLOWED_DOMAIN:kookmin.ac.kr}
    admin-emails: ${DOC_ADMIN_EMAILS:}
