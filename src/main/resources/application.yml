server:
  port: 8000

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # PESSIMISTIC_WRITE 락 충돌 시 PostgreSQL이 무한 대기하지 않도록 모든 커넥션에 lock_timeout 5초 적용.
      # 초과 시 SQLState 55P03 → Spring DAO가 CannotAcquireLockException으로 변환 → handleLockConflict가 409 LOCK_CONFLICT 응답.
      # Hibernate의 @QueryHint(jakarta.persistence.lock.timeout)은 PostgreSQL dialect가 supportsWait()=false라 silent no-op이므로 세션 GUC로 강제.
      # 주의: Flyway도 이 풀의 커넥션을 빌리므로 모든 마이그레이션에 5s 한도가 적용된다.
      # 더 긴 한도가 필요한 DDL(예: 대용량 ALTER, FK 추가)은 해당 마이그레이션 SQL 첫 줄에서 `SET LOCAL lock_timeout = '<더 긴 값>'`로 명시 오버라이드.
      connection-init-sql: "SET lock_timeout = '5s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Pre-Flyway baseline; existing schema captured by V1__baseline_schema.sql"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 1800000
    refresh-token-expiry: 1209600000
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
  auth:
    allowed-domain: ${ALLOWED_DOMAIN:kookmin.ac.kr}
    admin-emails: ${DOC_ADMIN_EMAILS:}
    # revoke 직후 이 시간(ms) 이내에 동일 refresh token이 다시 들어오면 도난이 아닌
    # 동시 refresh race로 보고 reuse 판정에서 제외한다 (#76).
    refresh-reuse-grace-period: 10000
    session-cleanup:
      # 만료된 세션을 즉시 지우지 않고 이 기간(일)만큼 보존한 뒤 삭제한다.
      expired-retention-days: 7
      # 일일 정리 잡 실행 시각 (Asia/Seoul).
      cron: "0 0 4 * * *"

ai:
  server:
    base-url: ${AI_SERVER_URL}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:5000}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:120000}
